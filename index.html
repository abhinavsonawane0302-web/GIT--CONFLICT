<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css"
        integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>CRUD WITH XHR GIT CONFLICT</title>

    <style>
        .spinner{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: rgba(225, 225, 225, 0.7);
            display: flex;

        }
    </style>

</head>

<body>

    <header class="bg-dark p-4 d-flex justify-content-between text-info">
   
        <div>
                    <h2 ><i class="fa-solid fa-user-graduate fa-1x"></i>STUDENT GRADE TABLE WITH XHR & FIREBASE</h2>

        </div>

    </header>


    <hr>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-8">
                <table class="table table-striped table-bordered ">

                    <thead class="table-dark">

                        <tr id="tableheading">

                            <th>STUDENT NAME</th>
                            <th>STUDENT COURSE</th>
                            <th>STUDENT GRADE</th>
                            <th>OPERATIONS</th>

                        </tr>

                    </thead>

                    <tbody id="table" class="table-hover">

                        <!-- <tr>

                        <td>abhi</td>
                        <td>s</td>
                        <td>88.1</td>
                        <td><button class="btn btn-sm btn-outline-primary text-dark">EDIT</button>
                            <button class="btn btn-sm btn-outline-danger text-dark">DELETE</button>
                        </td>

                        </tr> -->

                    </tbody>

                </table>
            </div>


            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <form id="form">

                            <h4>ADD STUDENT</h4>

                            <div>

                                <label for="sName"></label>
                                <div class="input-group mb-2 mr-sm-2">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text"><i class="fa-solid fa-user-tie"></i></div>
                                    </div>
                                    <input type="text" class="form-control" id="sName" placeholder="Student Name" required>
                                </div>


                            </div>


                            <div>

                                <label for="sCourse"></label>
                                <div class="input-group mb-2 mr-sm-2">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text"><i class="fa-solid fa-book-bookmark"></i></div>
                                    </div>
                                    <input type="text" class="form-control" id="sCourse" placeholder="Student Course" required>
                                </div>


                            </div>



                            <div>

                                <label for="sGrade"></label>
                                <div class="input-group mb-2 mr-sm-2">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text"><i class="fa-solid fa-graduation-cap"></i></div>
                                    </div>
                                    <input type="text" class="form-control" id="sGrade" placeholder="Student Grade" required>
                                </div>


                            </div>


                            <div>

                                <button class="btn btn-sm btn-outline-success text-dark" type="submit" id="addbtn">Add</button>
                                <button  class="btn btn-sm btn-outline-danger text-dark" type="button" id="updatebtn">Update</button>

                            </div>


                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
           <span class="sr-only">Loading...</span>
       </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>

</html>
